<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Ba lớp tài liệu, ba vai trò khác nhau</title>
  <desc id="desc">Design ghi ý định đã duyệt. Source và test chứng minh implementation. Wiki mô tả behavior hiện tại đã được xác minh từ source và test.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172B4D" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1440" height="620" rx="28" fill="#F7F5EF"/>
  <text x="72" y="70" font-family="Inter, system-ui, sans-serif" font-size="31" font-weight="750" fill="#17345B">BA LỚP TÀI LIỆU — BA VAI TRÒ KHÁC NHAU</text>
  <text x="72" y="112" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#52647A">Đừng dùng tài liệu mô tả ý định làm bằng chứng cho behavior đã ship.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="390" height="330" rx="22" fill="#FFFDF8" stroke="#D8CBAF" stroke-width="2"/>
    <rect x="510" y="170" width="420" height="330" rx="22" fill="#17345B"/>
    <rect x="980" y="170" width="390" height="330" rx="22" fill="#F0FBF8" stroke="#A8DCD2" stroke-width="2"/>
  </g>

  <rect x="98" y="198" width="142" height="34" rx="17" fill="#F7E7C6"/>
  <text x="169" y="221" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#865416">Ý ĐỊNH ĐÃ DUYỆT</text>
  <text x="98" y="277" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="750" fill="#17345B">Design (spec)</text>
  <text x="98" y="323" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#324C69">
    <tspan x="98" dy="0">Mô tả behavior cần xây,</tspan>
    <tspan x="98" dy="29">scope và quyết định đã duyệt.</tspan>
  </text>
  <line x1="98" y1="393" x2="430" y2="393" stroke="#E2D9C9" stroke-width="2"/>
  <text x="98" y="431" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="650" fill="#8A581B">Không chứng minh behavior đã chạy</text>
  <text x="98" y="466" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#64748B">changes/&lt;folder&gt;/design.md</text>

  <rect x="540" y="198" width="168" height="34" rx="17" fill="#D9E8F6"/>
  <text x="624" y="221" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#17345B">EVIDENCE HIỆN TẠI</text>
  <text x="540" y="277" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="750" fill="#FFFFFF">Source + test</text>
  <text x="540" y="323" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#E4EDF7">
    <tspan x="540" dy="0">Source cho biết code đang làm gì.</tspan>
    <tspan x="540" dy="29">Test kiểm tra các behavior đã có.</tspan>
  </text>
  <line x1="540" y1="393" x2="900" y2="393" stroke="#49617F" stroke-width="2"/>
  <text x="540" y="431" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="650" fill="#A7E3D7">review-and-verify đọc diff và chạy check</text>
  <text x="540" y="466" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#B8C8DA">src/ · test/ · command output</text>

  <rect x="1008" y="198" width="186" height="34" rx="17" fill="#D2F0E9"/>
  <text x="1101" y="221" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#176B61">BEHAVIOR ĐÃ VERIFY</text>
  <text x="1008" y="277" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="750" fill="#17345B">Wiki hiện tại</text>
  <text x="1008" y="323" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#324C69">
    <tspan x="1008" dy="0">Mô tả cách hệ thống đang chạy,</tspan>
    <tspan x="1008" dy="29">mỗi claim có source evidence.</tspan>
  </text>
  <line x1="1008" y1="393" x2="1340" y2="393" stroke="#B9DDD5" stroke-width="2"/>
  <text x="1008" y="431" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="650" fill="#176B61">Không ghi proposal chưa implement</text>
  <text x="1008" y="466" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#64748B">docs/llm/</text>

  <path d="M470 330 H500" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M940 330 H970" fill="none" stroke="#1C9B8A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="485" y="366" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748B">build</text>
  <text x="955" y="366" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#178477">verify</text>

  <rect x="70" y="535" width="1300" height="52" rx="16" fill="#E8EEF4"/>
  <text x="720" y="568" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="650" fill="#263E5D">Design định hướng công việc → source/test làm bằng chứng → wiki ghi lại behavior đã xác minh</text>
</svg>
